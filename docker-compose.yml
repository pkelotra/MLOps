services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.inference
    ports:
      - "8000:8000"
    environment:
      - MODEL_ARTIFACT_PATH=artifacts/serving_pipeline.pkl
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db
      - LOG_LEVEL=INFO
      - REFERENCE_DATA_PATH=monitoring/reference.json
      - CURRENT_DATA_PATH=monitoring/current.json
      - DRIFT_THRESHOLD=0.20
    depends_on: [mlflow]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlartifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlartifacts
      - mlflow_db:/mlflow

volumes:
  mlflow_data:
  mlflow_db:
