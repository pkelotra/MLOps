name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q
      - run: python -m json.tool contracts/model_contract.json > /dev/null
      - run: docker build -f docker/Dockerfile.inference -t electricity-mlops-api:ci .
