name: Deploy
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build the production image
      - name: Build Docker image
        run: docker build -f docker/Dockerfile.inference -t electricity-mlops-api:${{ github.sha }} .

      # Run smoke test against built image
      - name: Smoke test
        run: |
          docker run -d --name smoke-test -p 8000:8000 \
            -e MODEL_ARTIFACT_PATH=artifacts/serving_pipeline.pkl \
            electricity-mlops-api:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8000/health || (docker logs smoke-test && exit 1)
          docker stop smoke-test
          docker rm smoke-test

      # Tag as latest
      - name: Tag latest
        run: docker tag electricity-mlops-api:${{ github.sha }} electricity-mlops-api:latest

