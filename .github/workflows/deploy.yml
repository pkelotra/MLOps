name: Deploy
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.inference -t electricity-mlops-api:${{ github.sha }} .
      # Add registry login/push and cloud deployment after the deployment target is selected.
